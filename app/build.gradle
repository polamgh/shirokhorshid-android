// Wire into build: generate before any compilation
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn generateEmbeddedValues
}

android {
    namespace 'com.psiphon3'

    // Version: CalVer YYYY.MM.DD from env var, or version.properties fallback
    def calver = System.getenv('APP_VERSION_NAME') ?: ''
    def verCode
    def verName

    if (calver) {
        verName = calver
        // versionCode: YYYYMMDD * 100 + run number (allows 100 builds/day)
        def run = (System.getenv('APP_VERSION_RUN') ?: '0').toInteger()
        verCode = calver.replace('.', '').toInteger() * 100 + run
    } else {
        def versionPropsFile = rootProject.file('version.properties')
        if (versionPropsFile.canRead()) {
            def Properties props = new Properties()
            props.load(new FileInputStream(versionPropsFile))
            verName = props['VERSION_CODE'] ?: '1'
            verCode = verName.toInteger()
        } else {
            verName = '0.0.0'
            verCode = 1
        }
    }

    defaultConfig {
        applicationId "com.azaditunnel.vpn"
        resValue "string", "tray__authority", "${applicationId}.tray"
        minSdkVersion 24
        compileSdk 35
        targetSdkVersion 35
        versionCode verCode
        versionName verName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        externalNativeBuild {
            ndkBuild {
                // 16 KB page size support
                arguments "APP_LDFLAGS+=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            }
        }
    }

    signingConfigs {
        release
    }

    // Configure output APK file name
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def fileName = "AzadiTunnel-${variant.buildType.name}.apk"
            output.outputFileName = fileName
        }
    }

    buildTypes {
        debug {
            debuggable true
            pseudoLocalesEnabled true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            jniDebuggable false
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }


    def propFile = rootProject.file('signing.properties')
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        compose true
    }


    if (propFile.canRead()) {
        def Properties props = new Properties()
        props.load(new FileInputStream(propFile))

        if (props != null && props.containsKey('STORE_FILE') && props.containsKey('STORE_PASSWORD') &&
            props.containsKey('KEY_ALIAS') && props.containsKey('KEY_PASSWORD')) {
            android.signingConfigs.release.storeFile = file(props['STORE_FILE'])
            android.signingConfigs.release.storePassword = props['STORE_PASSWORD']
            android.signingConfigs.release.keyAlias = props['KEY_ALIAS']
            android.signingConfigs.release.keyPassword = props['KEY_PASSWORD']
        } else {
            println 'signing.properties found but some entries are missing'
        }
    } else {
        println 'signing.properties not found!'
    }

    // Using NDK r25c for stable Apple Silicon (M1/M2/M3) support.
    ndkVersion '25.2.9519653'

    packaging {
        jniLibs {
            // AGP 8.5.1+ aligns uncompressed .so entries on 16 KB ZIP boundaries.
            useLegacyPackaging = false
        }
    }

    externalNativeBuild {
        ndkBuild {
            // Path to the tun2socks NDK build script
            path "src/main/jni/Android.mk"
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

}

